{{- /* Sponsorship tiers from data/sponsors.yaml, with open-slot counts. */ -}}
<div class="tier-cards">
  {{ range hugo.Data.sponsors }}
  <article class="tier-card">
    <h3>{{ .tier }}</h3>
    <p class="price">${{ lang.FormatNumber 0 .price }}</p>
    <p class="slots">{{ partial "tier-slots.html" . }}</p>
    {{ with .summary }}<p class="tier-summary">{{ . }}</p>{{ end }}
    <ul class="benefits">{{ range .benefits }}<li>{{ . }}</li>{{ end }}</ul>
  </article>
  {{ end }}
</div>
