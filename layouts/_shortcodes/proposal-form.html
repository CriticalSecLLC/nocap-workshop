{{- /* A centered button to the proposal Google Form (params.proposal_form). Until it is set, say the form opens soon. */ -}}
{{ with site.Params.proposal_form }}
<p class="proposal-cta"><a class="btn" href="{{ . }}" target="_blank" rel="noopener">Open the proposal form →</a></p>
{{ else }}
<p class="note">The proposal form opens soon.</p>
{{ end }}
