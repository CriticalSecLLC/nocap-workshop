{{- /* The proposal Google Form (params.proposal_form), embedded, with a new-tab link as a fallback for blocked networks and small screens. */ -}}
{{ with site.Params.proposal_form }}
<p class="proposal-open"><a href="{{ . }}" target="_blank" rel="noopener">Open the form in a new tab →</a></p>
<iframe class="proposal-embed" title="Session proposal form" src="{{ . }}{{ if in . "?" }}&{{ else }}?{{ end }}embedded=true" loading="lazy">The form could not be shown here. <a href="{{ . }}">Open it in a new tab</a>.</iframe>
{{ else }}
<p class="note">The proposal form opens soon.</p>
{{ end }}
