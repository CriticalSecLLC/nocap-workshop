<form class="signup" action="{{ site.Params.signupAction }}" method="post">
  <label for="signup-email">Get the schedule and viewing links by email</label>
  <div class="signup-row">
    <input id="signup-email" type="email" name="email" placeholder="you@company.com" autocomplete="email" required>
    <button class="btn" type="submit">Notify me</button>
  </div>
  <p class="fine">Email only, used only to announce the workshop. You do not need to sign up to attend.</p>
</form>
