baseURL = "https://nocap-workshop.com/"
locale = "en-US"
title = "No-Cap Workshop"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "Three free days of practitioner-led sessions on meeting FedRAMP's VDR rules before the March 7, 2027 deadline."
  org = "https://criticalsec.com"
  repo = "https://github.com/criticalsecllc/nocap-workshop"
  # Announcement-list form posts here. Buttondown embed-subscribe endpoint; the
  # username in the path must match the account that gets created.
  signupAction = "https://buttondown.com/api/emails/embed-subscribe/nocap-workshop"
  # TODO: confirm this mailbox exists before launch.
  contact = "hello@nocap-workshop.com"

[menus]
  [[menus.main]]
    name = "Why"
    pageRef = "/why"
    weight = 10
  [[menus.main]]
    name = "FAQ"
    pageRef = "/faq"
    weight = 60
  [[menus.main]]
    name = "Sessions"
    pageRef = "/sessions"
    weight = 20
  [[menus.main]]
    name = "Sponsors"
    pageRef = "/sponsors"
    weight = 35
  [[menus.main]]
    name = "Private"
    pageRef = "/private-sessions"
    weight = 40
  [[menus.main]]
    name = "Leads"
    pageRef = "/leads"
    weight = 30
  [[menus.main]]
    name = "Resources"
    pageRef = "/resources"
    weight = 50

[markup.goldmark.renderer]
  unsafe = true

[minify]
  disableXML = true
