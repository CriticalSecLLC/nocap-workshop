baseURL = "https://nocap-workshop.com/"
enableGitInfo = true
locale = "en-US"
title = "No-CAP Workshop"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  # Site-wide status bar, pinned to the top of every page, with the announcement signup beside it. Delete the line to remove it.
  banner = "**Status:** [Call for Sessions](/propose/) is open. Initial sponsors are being posted now — thanks! [Sign up for announcements](/#updates)."
  description = "Three free days of practitioner-led sessions on meeting FedRAMP's VDR rules before the March 7, 2027 deadline."
  org = "https://criticalsec.com"
  repo = "https://github.com/criticalsecllc/nocap-workshop"
  # Announcement-list form posts here. Buttondown embed-subscribe endpoint; the
  # username in the path must match the account that gets created.
  signupAction = "https://buttondown.com/api/emails/embed-subscribe/nocap-workshop"
  # General questions (footer) and the two topic mailboxes.
  contact = "questions@nocap-workshop.com"
  contact_sponsors = "sponsorship@nocap-workshop.com"
  contact_leads = "leads@nocap-workshop.com"
  # Session proposals: the deadline shown on the site, and the Google Form link (the
  # form's public "viewform" URL). While it is empty the Propose page says the form
  # opens soon.
  proposal_deadline = "January 8, 2027"
  proposal_form = "https://docs.google.com/forms/d/e/1FAIpQLSdyrCW_ufAyBHDHdAwZBBmVqfIzOAyT0_TO1fo9t2dQ5T9JMQ/viewform"

[menus]
  [[menus.main]]
    name = "Why"
    pageRef = "/why"
    weight = 10
  [[menus.main]]
    name = "Sessions"
    pageRef = "/sessions"
    weight = 20
  [[menus.main]]
    name = "Private"
    pageRef = "/private-sessions"
    weight = 30
  [[menus.main]]
    name = "Leads"
    pageRef = "/leads"
    weight = 40
  [[menus.main]]
    name = "Propose"
    pageRef = "/propose"
    weight = 50
  [[menus.main]]
    name = "Sponsors"
    pageRef = "/sponsors"
    weight = 60
  [[menus.main]]
    name = "Steering"
    pageRef = "/steering"
    weight = 70
  [[menus.main]]
    name = "FAQ"
    pageRef = "/faq"
    weight = 80

[markup.goldmark.renderer]
  unsafe = true

[minify]
  disableXML = true
