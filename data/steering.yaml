# Steering Committee roster. `seats` is the number of voting seats; open seats are
# computed from the members listed. Keep affiliations current (see the charter on
# conflicts of interest). An optional `url` links the member's name. A member may
# have a `bio` and a `photo` (under assets/), or a `lead` id to reuse that lead's
# bio and photo from data/leads.yaml.
seats: 3
members:
  - name: George Chamales
    affiliation: CriticalSec
    affiliation_url: https://criticalsec.com
    role: Member and organizer
    lead: george-chamales
  - name: Sam Aydlette
    affiliation: Independent
    affiliation_url: https://samaydlette.com
    url: https://samaydlette.com
    role: Member
    photo: img/sam-aydlette.jpg
    bio: >-
      Sam Aydlette has worked in cybersecurity for more than a decade, in both federal government and private industry. On FedRAMP, he's helped write federal policy, advised hyperscale cloud providers on how to meet them, and run the scans himself. That means he's been both the person writing the requirements and the person asking who the heck wrote the requirements. He's seen plenty of things that look fine on paper fall apart in production, and plenty that work fine in production fall apart once legal and policy weigh in. He's most at home working in that gap. Before cybersecurity, he served as an infantryman with the 82nd Airborne Division, which is where he first learned that plans and the ground don't always agree.
  - name: Rob Gil
    affiliation: REM5
    affiliation_url: https://www.rem5.com/
    role: Member
    photo: img/rob-gil.jpg
    bio: >-
      Rob Gil has spent over 20 years in security, leading initiatives at cloud service providers including Okta, Elastic, and Salesforce. Through REM5 he advises cloud service providers on the architecture and security work needed to meet the most stringent requirements of the U.S. public sector.


      He also contributes to the standards themselves, working on current and emerging guidance from NIST and FedRAMP, and was instrumental in writing the first Okta STIG.

