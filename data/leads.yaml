- id: rob-gil
  name: Rob Gil
  org: REM5
  org_url: https://www.rem5.com/
  photo: img/rob-gil.jpg
  bio: >-
    Rob Gil has spent over 20 years in security, leading initiatives at cloud service providers including Okta, Elastic, and Salesforce. Through REM5 he advises cloud service providers on the architecture and security work needed to meet the most stringent requirements of the U.S. public sector.


    He also contributes to the standards themselves, working on current and emerging guidance from NIST and FedRAMP, and was instrumental in writing the first Okta STIG.
