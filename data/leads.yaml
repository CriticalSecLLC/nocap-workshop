# One entry per lead. `id` is what a session lists under `leads:` in its
# front matter, so the same person renders consistently on every page.
#
# - id: "first-last"
#   name: "Name"
#   org: "Company"
#   org_url: "https://..."            # optional; makes the org a link
#   role: "Title"
#   group: "Cloud service provider"   # cloud service provider | auditor | advisor | vendor
#   bio: "One or two sentences. Markdown links are fine."
#   photo: "img/first-last.jpg"       # under assets/
#   booking: "https://..."            # optional intro-call link; add only once the committee has approved the private session listing; shown on this page and, with
#                                     # offering/offering_url, in the Private Sessions table
#   offering: "Name of the private session"
#   offering_url: "https://..."
#   listing_only: true                # optional; a private session contact who is not presenting: shown only in the Private Sessions table, not on the Leads page
- id: george-chamales
  name: George Chamales
  org: CriticalSec
  org_url: https://criticalsec.com
  booking: https://calendly.com/georgechamales
  offering: Rampart
  offering_url: /tracks/rampart/
  photo: img/george-chamales.jpg
  bio: >-
    George Chamales built [Cisco Security Cloud for Government](https://www.fedramp.gov/marketplace/products/FR2304757473A/), the company's flagship FedRAMP delivery platform, and took seven of their products to FedRAMP High. He was the first hire for the project responsible for its architecture, led the development and implementation, coordinated the audits, collaborated with Agencies (including building an integration with DHS CISA Protective DNS), and served as the FIPS lead because nobody else wanted the job. Coincidentally he's the author of The Analogy Platform and the driving force behind the Rampart Strategy.
- id: sam-aydlette
  name: Sam Aydlette
  org: Independent
  org_url: https://www.samaydlette.com
  photo: img/sam-aydlette.jpg
  bio: >-
    Sam Aydlette has worked in cybersecurity for more than a decade, in both federal government and private industry. On FedRAMP, he's helped write federal policy, advised hyperscale cloud providers on how to meet them, and run the scans himself. That means he's been both the person writing the requirements and the person asking who the heck wrote the requirements. He's seen plenty of things that look fine on paper fall apart in production, and plenty that work fine in production fall apart once legal and policy weigh in. He's most at home working in that gap. Before cybersecurity, he served as an infantryman with the 82nd Airborne Division, which is where he first learned that plans and the ground don't always agree.
- id: matthew-venne
  name: Matthew Venne
  org: stackArmor
  org_url: https://stackarmor.com
  photo: img/matthew-venne.jpg
  bio: >-
    Matthew Venne is Chief Technology Officer at stackArmor, with nearly 15 years of experience
    in federal information security. He is the chief architect of three FedRAMP-authorized
    platforms and the author of [stackArmor's public white papers on FedRAMP
    VDR/VER](https://stackarmor.github.io/rfc-fedramp-vdr/), covering vulnerability evaluation,
    PAIN scoring, internet reachability, and evidence-backed response. He publishes his methods
    openly to support community scrutiny, reuse, and improvement.
